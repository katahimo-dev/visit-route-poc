<html lang="ja">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>訪問ルート（移転しました）</title>
    <!-- 旧アドレス（プロジェクトIDのまま）から、デモのサイトへ同じパスのまま移す -->

    <p>訪問ルートは <a href="https://katahimo-visit-route-demo.web.app/">https://katahimo-visit-route-demo.web.app/</a> に移りました。</p>
